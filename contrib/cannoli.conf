# Example production configuration (see README "Running in Production").
# Validate with:  cannoli -t -c /etc/cannoli/cannoli.conf
# Apply changes:  systemctl reload cannoli   (listener/user changes need a restart)

[server]
# Behind nginx/Caddy: listen on loopback and trust the proxy's headers.
host = 127.0.0.1
port = 8080
trusted_proxies = 127.0.0.1, ::1
workers = 8
max_requests = 10000
backlog = 1024

# Request reading / writing limits (seconds, bytes)
header_timeout = 20
timeout = 30
body_min_rate = 1024
write_timeout = 30
keep_alive_timeout = 2
max_body_size = 10485760
max_header_size = 16384
shutdown_timeout = 15

# Per-client limits (0 = off). Connection limit counts sockets from one
# address (proxies listed above are exempt); rate limit counts requests per
# client address over rate_limit_window seconds.
max_connections_per_ip = 0
rate_limit = 0
rate_limit_window = 1

health_path = /healthz
request_id = true
tokens = false

[headers]
X-Content-Type-Options = nosniff
Referrer-Policy = strict-origin-when-cross-origin
X-Frame-Options = SAMEORIGIN
# With HTTPS only:
# Strict-Transport-Security = max-age=31536000; includeSubDomains

[admin]
# /__admin (JSON), /__admin/metrics (Prometheus) from these addresses only
enabled = true
allowed_ips = 127.0.0.1, ::1

[log]
level = info
error_file = /var/log/cannoli/error.log
access_file = /var/log/cannoli/access.log

# Serving HTTPS directly instead of behind a proxy:
# [ssl]
# enabled = true
# port = 443
# cert = /etc/letsencrypt/live/example.com/fullchain.pem
# key = /etc/letsencrypt/live/example.com/privkey.pem
# min_version = 1.2
# (renewals: a certbot deploy hook running `systemctl reload cannoli`)

# FastCGI behind nginx instead of HTTP:
# [fastcgi]
# enabled = true
# socket = unix:/run/cannoli/cannoli.sock
# socket_mode = 0660
