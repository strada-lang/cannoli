<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminale - sign in</title>
<link rel="icon" href="static/favicon.svg">
<link rel="manifest" href="static/manifest.webmanifest">
<link rel="stylesheet" href="static/app.css?v={{v}}">
</head>
<body class="login-body">
<form id="login" class="login-card" autocomplete="on">
  <div class="login-logo"><img src="static/favicon.svg" alt="" width="40" height="40"><span>Terminale</span></div>
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <label for="code" {{totp}}>Authenticator code</label>
  <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" {{totp}}>
  <div id="error" class="login-error" role="alert" hidden></div>
  <button type="submit" id="submit">Sign in</button>
</form>
<script src="static/login.js?v={{v}}"></script>
</body>
</html>
