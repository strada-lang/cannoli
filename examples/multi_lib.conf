# A library mounted under a URL prefix: requests to /app/... go to myapp.so
# with path_info set to the rest of the path. Several libraries may be
# mounted; the longest matching prefix wins.
#
#   strada --shared examples/myapp.strada -o examples/myapp.so
#   ./cannoli -c examples/multi_lib.conf        # then open http://127.0.0.1:18082/app/
[server]
host = 127.0.0.1
port = 18082
workers = 1

[library]
/app = examples/myapp.so
