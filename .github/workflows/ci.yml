# Builds Strada from source, then builds Cannoli and runs its test suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libssl-dev libperl-dev \
            curl netcat-openbsd python3 openssl apache2-utils xxd

      - name: Build and install Strada
        run: |
          git clone --depth 1 https://github.com/strada-lang/strada-lang.git "$RUNNER_TEMP/strada"
          cd "$RUNNER_TEMP/strada"
          # On failure the end of the log becomes an error annotation, so
          # the cause shows on the run's summary page.
          step() {
            name="$1"; shift
            if ! "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              tail -n 60 "$RUNNER_TEMP/$name.log"
              msg=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/$name.log" | tail -n 25 | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Strada $name failed::$msg"
              exit 1
            fi
          }
          step configure ./configure   # a plain "make" from a clean clone fails to link Strada's tools
          step make make               # not -j: the Strada Makefile is not parallel-safe
          step install sudo make install

      - name: Build Cannoli
        run: make

      - name: Build the Perl library
        run: make -C lib/perl PERL=/usr/bin/perl

      - name: Test
        run: ./t/run_tests.sh
